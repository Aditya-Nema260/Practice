<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1 id="title">Hello</h1>
    <p class="desc">Welcome to training</p>
    <div id="box">Old Content</div>
    <ul id="internList">
      <li>Existing Intern</li>
    </ul>

    <ul id="tasks">
      <li>Task 1</li>
      <li id="removeMe">Task 2</li>
    </ul>

    <button id="clickMe">Click Me</button>
    <p id="output"></p>
    <div
      id="hoverBox"
      style="width: 100px; height: 100px; background: gray"
    ></div>

    <a id="myAnchor" href="https://w3schools.com/">Go to W3Schools.com</a>
 
    <p id="link">
      The preventDefault() method will prevent the link above from following the
      URL.
    </p>

    <form id="signupForm">
      <input type="text" id="username" placeholder="Enter username" />
      <button type="submit">Submit</button>
      <p id="errorMsg"></p>
    </form>

    <form id="emailForm">
        <input type="text" id="email" placeholder=" Enter email" />
        <button type="submit">Submit</button>
        <p id="emailError"></p>
    </form>
    
    <input id="inputBox" value="" type="text" /> 
    <button id="button">Click</button>
    <p id = "count">Countdown: 10</p>
    <button id = "countBtn"> Start </button>
    <button id = "stop"> Stop </button>
    <script src="script.js"></script>
  </body>
</html>
